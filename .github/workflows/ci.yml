name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check src/js/app.js
          node --check src/js/float.js
          node --check src/js/common.js
          node --check scripts/gen-icon.js
          node --check tests/main-process.test.js
          node --check tests/gui-smoke.js

      - name: Run main-process tests
        run: npm test

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libasound2t64 \
            libatspi2.0-0t64 \
            libayatana-appindicator3-1 \
            libgbm1 \
            libgtk-3-0t64 \
            libnss3 \
            libnotify4 \
            libsecret-1-0 \
            libxss1 \
            libxtst6

      - name: Run GUI smoke test
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:gui 2>&1 | tee gui.log

      - name: Publish GUI diagnostics
        if: failure()
        run: |
          {
            echo "### GUI smoke diagnostics"
            echo '```text'
            tail -n 120 gui.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
