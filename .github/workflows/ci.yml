name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check src/js/app.js
          node --check src/js/float.js
          node --check src/js/common.js
          node --check scripts/gen-icon.js
          node --check tests/main-process.test.js
          node --check tests/gui-smoke.js

      - name: Run main-process tests
        run: npm test

  gui:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run GUI smoke test
        run: npm run test:gui
