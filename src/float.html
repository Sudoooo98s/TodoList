<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>悬浮窗</title>
  <link rel="stylesheet" href="css/float.css" />
</head>
<body>
  <div class="float-card">
    <div class="float-head">
      <div class="float-title">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
        <span>今日待办</span>
        <span id="count" class="count">0</span>
      </div>
      <button id="closeFloat" class="float-close" title="关闭悬浮窗" aria-label="关闭悬浮窗">
        <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
      </button>
    </div>
    <ul id="list" class="float-list"></ul>
    <div id="empty" class="float-empty hidden">
      <p>今天没有待办，</p>
      <p>好好休息吧</p>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/float.js"></script>
</body>
</html>
