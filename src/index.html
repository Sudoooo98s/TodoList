<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>每日清单</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
        <span>每日清单</span>
      </div>
      <div class="top-actions">
        <button id="btnFloat" class="ghost-btn" title="显示/隐藏置顶悬浮窗">
          <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V5h14v14z"/></svg>
          悬浮窗
        </button>
        <button id="btnSettings" class="ghost-btn" title="设置">
          <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.61 3.61 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          设置
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-left">
        <h1 id="viewTitle">今天要做的事</h1>
        <div class="hero-sub" id="heroSub">还剩 0 件 · 本周已完成 0 件</div>
      </div>
      <div class="date-nav">
        <button id="prevDay" class="nav-btn" title="前一天">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6 4.6-4.6z"/></svg>
        </button>
        <button id="todayBtn" class="nav-btn nav-today">今天</button>
        <button id="nextDay" class="nav-btn" title="后一天">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6-4.6 4.6z"/></svg>
        </button>
      </div>
    </section>

    <!-- 近 7 天完成趋势 -->
    <section id="weekChart" class="week-chart"></section>

    <section class="add-card">
      <div class="add-row">
        <input id="quickInput" type="text" placeholder="添加一件事，回车保存…" maxlength="100" autocomplete="off" />
        <button id="toggleDetail" class="icon-btn" title="展开详细设置">
          <span>详细</span>
          <svg id="chevron" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6 1.4-1.4z"/></svg>
        </button>
        <button id="addBtn" class="primary-btn">添加</button>
      </div>
      <div id="detailPanel" class="detail-panel hidden">
        <div class="field-grid">
          <label class="field">
            <span class="field-label">日期</span>
            <input type="date" id="fDate" />
          </label>
          <label class="field">
            <span class="field-label">时间（可选）</span>
            <input type="time" id="fTime" />
          </label>
          <label class="field">
            <span class="field-label">提醒</span>
            <select id="fRemind">
              <option value="">不提醒</option>
              <option value="0">到点提醒</option>
              <option value="5">提前 5 分钟</option>
              <option value="10">提前 10 分钟</option>
              <option value="15" selected>提前 15 分钟</option>
              <option value="30">提前 30 分钟</option>
              <option value="60">提前 1 小时</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">重复</span>
            <select id="fRepeat">
              <option value="" selected>不重复</option>
              <option value="daily">每天</option>
              <option value="weekly">每周</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">优先级</span>
            <select id="fPriority">
              <option value="high">高</option>
              <option value="medium" selected>中</option>
              <option value="low">低</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">分类</span>
            <select id="fCategory"></select>
          </label>
        </div>
        <label class="field field-wide">
          <span class="field-label">备注（可选）</span>
          <textarea id="fNote" rows="2" maxlength="500" placeholder="补充细节…"></textarea>
        </label>
        <div class="detail-actions">
          <button id="cancelEdit" class="text-btn hidden">取消编辑</button>
        </div>
      </div>
    </section>

    <main class="content">
      <ul id="taskList" class="task-list"></ul>
      <div id="emptyState" class="empty hidden">
        <svg viewBox="0 0 24 24" width="42" height="42"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
        <p id="emptyText">这一天没有待办事项</p>
      </div>

      <div class="done-section hidden" id="doneSection">
        <button id="doneToggle" class="done-toggle">
          <svg id="doneChevron" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6 1.4-1.4z"/></svg>
          <span id="doneCount">已完成 (0)</span>
        </button>
        <ul id="doneList" class="task-list done hidden"></ul>
      </div>
    </main>
  </div>

  <!-- 设置弹窗 -->
  <div id="settingsModal" class="modal-mask hidden">
    <div class="modal">
      <div class="modal-head">
        <h2>设置</h2>
        <button id="closeSettings" class="icon-btn" title="关闭">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <h3>常规</h3>
          <label class="switch-row">
            <span>开机自动启动</span>
            <input type="checkbox" id="autoLaunchToggle" />
            <span class="switch"></span>
          </label>
          <div class="select-row">
            <span>自动清理已完成任务</span>
            <select id="autoCleanSelect">
              <option value="0" selected>不清理</option>
              <option value="7">7 天前</option>
              <option value="30">30 天前</option>
              <option value="90">90 天前</option>
            </select>
          </div>
        </div>
        <div class="setting-group">
          <h3>分类管理</h3>
          <div id="catList" class="cat-list"></div>
          <div class="cat-add">
            <input type="text" id="catInput" placeholder="新分类名称" maxlength="20" />
            <button id="catAddBtn" class="primary-btn small">添加</button>
          </div>
        </div>
        <div class="setting-group">
          <h3>悬浮窗</h3>
          <label class="switch-row">
            <span>显示置顶悬浮窗（始终显示今日未完成任务）</span>
            <input type="checkbox" id="floatToggle" />
            <span class="switch"></span>
          </label>
        </div>
        <div class="setting-group">
          <h3>提醒</h3>
          <p class="hint">提醒在设定时间前弹出 Windows 系统通知，需要应用保持运行（最小化到托盘即可）。</p>
          <button id="testNotify" class="ghost-btn">发送测试通知</button>
        </div>
        <div class="setting-group">
          <h3>数据</h3>
          <p class="hint break" id="dataPath">-</p>
          <p class="hint">数据保存在本机，每次保存自动备份一份（todo-data.backup.json）。</p>
          <div class="data-actions">
            <button id="btnExport" class="ghost-btn">导出数据…</button>
            <button id="btnImport" class="ghost-btn">导入数据…</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部提示条（如删除撤销） -->
  <div id="toast" class="toast hidden">
    <span id="toastText"></span>
    <button id="toastAction" class="toast-btn hidden"></button>
  </div>

  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
